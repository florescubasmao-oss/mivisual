const SUPABASE_URL='https://uudvodiaizfarodjpetb.supabase.co',KEY='sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D';

async function crApi(payload){
 const gen=generation;const {data,error}=await client.auth.getSession();if(error||!data.session)throw Error('Ingresa con tu cuenta del piloto.');
 const mutation=!['listarConsultasReclamos','listarHistorialReclamo'].includes(payload.accion);const owner=data.session.user.id;delete payload.usuario;
 if(mutation&&sending)throw Error('Espera a que termine la operación actual.');
 if(mutation){if(payload.id)payload.version=window.mesaVersions[payload.id];const fingerprint=owner+JSON.stringify(payload);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(fingerprint)))).map(x=>x.toString(16).padStart(2,'0')).join('');const key='mesa-request:'+owner+':'+hash;payload.requestId=sessionStorage.getItem(key)||crypto.randomUUID();sessionStorage.setItem(key,payload.requestId);pending.set(payload.requestId,key);sending=true;document.querySelectorAll('#pantalla button').forEach(b=>b.disabled=true)}
 try{const response=await fetch(SUPABASE_URL+'/functions/v1/mesa-ayuda-pilot',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(gen!==generation)throw Error('La sesión cambió.');if(!response.ok||!result.ok)throw Error(result.error||'No se pudo completar. Reintenta.');if(mutation){sessionStorage.removeItem(pending.get(payload.requestId));pending.delete(payload.requestId)}return result}finally{if(mutation){sending=false;document.querySelectorAll('#pantalla button').forEach(b=>b.disabled=false)}}
}
