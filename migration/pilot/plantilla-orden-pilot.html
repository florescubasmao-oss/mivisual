<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI VISUAL · Plantilla Orden</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:Arial,sans-serif;background:#f5f7fb;color:#102033}.wrap{max-width:1280px;margin:auto}h1{margin:0 0 5px}.lead{margin:0 0 14px;color:#64748b}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;padding:9px;border-radius:9px;border:1px solid #cbd5e1}input,select,textarea{width:100%}textarea{min-height:74px}button{border:0;background:#0f6fff;color:white;font-weight:700;cursor:pointer}button.sec{background:#475569}button.good{background:#15803d}button.warn{background:#b45309}button.danger{background:#b91c1c}.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}.notice{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px}.ok{color:#15803d}.err{color:#b91c1c}.muted{color:#64748b}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.metric{border:1px solid #dbe3ec;border-radius:10px;padding:10px;background:#f8fafc}.metric b{display:block;font-size:20px}.tablewrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;white-space:nowrap}tr.pick{cursor:pointer}tr.pick:hover{background:#eef6ff}.hidden{display:none!important}pre{white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:9px;overflow:auto}.links a{margin-right:7px}
@media(max-width:650px){body{padding:7px}.card{padding:10px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<h1>Plantilla de Orden</h1><p class="lead">Búsqueda unificada por cliente, DNI, orden o pedido</p>
<div class="card"><div class="notice">Consulta PostgreSQL con alcance por perfil. Esta herramienta no modifica la orden.</div><div class="row" style="margin-top:8px"><input id="consulta" style="flex:1" placeholder="Código cliente / DNI / orden / pedido"><button onclick="buscar()">Buscar</button></div><div id="msg"></div></div>
<div id="res" class="card hidden"><div class="grid"><div><h3>Plantilla</h3><pre id="plantilla"></pre><button onclick="copiar()">Copiar plantilla</button></div><div><h3>Datos de orden</h3><pre id="orden"></pre><button id="ctoBtn" class="sec" onclick="ctos()">CTO cercanas</button></div></div></div>
<div id="ctosCard" class="card hidden"><h3>CTO cercanas</h3><div id="ctos"></div></div>
<script>
const URL="https://uudvodiaizfarodjpetb.supabase.co",KEY="sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D",API=URL+"/functions/v1/plantilla-orden-pilot";const sb=supabase.createClient(URL,KEY);let DATA=null;
const E=id=>document.getElementById(id),H=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||""}async function api(d){const t=await tok();if(!t)throw Error("Inicie sesión.");const u=new URL(API);Object.entries(d).forEach(([k,v])=>{if(v!==""&&v!=null)u.searchParams.set(k,String(v))});const r=await fetch(u,{headers:{Authorization:"Bearer "+t,apikey:KEY}}),x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"Error");return x}
async function buscar(){try{E("msg").textContent="Buscando...";DATA=await api({accion:"consultarPlantillaOrden",consulta:E("consulta").value});E("res").classList.remove("hidden");E("plantilla").textContent=DATA.plantilla||"";E("orden").textContent=JSON.stringify(DATA.orden,null,2);E("msg").className="ok";E("msg").textContent="Encontrado por "+(DATA.criterioBusqueda||"criterio operativo")+".";const o=DATA.orden||{};E("ctoBtn").disabled=!(Number.isFinite(Number(o.latitud))&&Number.isFinite(Number(o.longitud)))}catch(e){E("msg").className="err";E("msg").textContent=e.message}}
async function copiar(){try{await navigator.clipboard.writeText(E("plantilla").textContent||"");E("msg").className="ok";E("msg").textContent="Plantilla copiada."}catch(e){E("msg").className="err";E("msg").textContent="No se pudo copiar."}}
async function ctos(){try{const o=DATA?.orden||{};const d=await api({accion:"buscarCtosCercanasPlantillaOrden",latitud:o.latitud,longitud:o.longitud,radio:400,limite:20});E("ctosCard").classList.remove("hidden");E("ctos").innerHTML=(d.ctos||[]).map(x=>'<div class="card"><b>'+H(x.cto||x.codigo_cto||"CTO")+'</b> · '+H(Math.round(Number(x.distanciaMetros||0)))+' m<br><small>'+H(x.direccion||x.referencia||"")+'</small></div>').join("")||'<span class="muted">Sin CTO cercanas.</span>'}catch(e){E("ctos").innerHTML='<span class="err">'+H(e.message)+'</span>'}}
E("consulta").addEventListener("keydown",e=>{if(e.key==="Enter")buscar()});
</script><script src="shell-embed.js"></script></body></html>
