<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI VISUAL · Análisis Económico</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f5f7fb;color:#102033}.wrap{max-width:1280px;margin:auto}h1{margin:0 0 5px}.lead{color:#64748b;margin:0 0 14px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;padding:9px;border-radius:9px;border:1px solid #cbd5e1}input,select,textarea{width:100%}textarea{min-height:72px}button{border:0;background:#0f6fff;color:#fff;font-weight:700;cursor:pointer}button.sec{background:#475569}button.good{background:#15803d}button.warn{background:#b45309}button.danger{background:#b91c1c}button:disabled{opacity:.5}.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}.notice{padding:10px;background:#fff7ed;color:#9a3412;border-radius:10px;font-size:13px}.ok{color:#15803d}.err{color:#b91c1c}.muted{color:#64748b}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.metric{background:#f8fafc;border:1px solid #dbe3ec;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}.tablewrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;white-space:nowrap}tr.pick{cursor:pointer}tr.pick:hover{background:#eef6ff}.hidden{display:none!important}pre{white-space:pre-wrap;background:#f8fafc;border-radius:9px;padding:10px;overflow:auto}.pill{padding:3px 7px;border-radius:999px;background:#e2e8f0;font-size:11px}.pill.ok{background:#dcfce7}.pill.bad{background:#fee2e2;color:#991b1b}
@media(max-width:650px){body{padding:7px}.card{padding:10px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<h1>Análisis Económico</h1><p class="lead">Producción valorizada, materiales, bonos, gastos y utilidad</p>
<div class="card"><div id="ctx" class="muted">Cargando...</div><div class="notice" style="margin-top:8px"><b>Importante:</b> la utilidad de septiembre es parcial mientras falten gastos directos. La pantalla nunca convierte una utilidad incompleta en “confirmada”.</div><div id="fresh" style="margin-top:8px"></div></div>
<div class="card"><div class="grid"><input id="periodo" value="2026-09"><select id="sede"><option>TODAS</option><option>CHICLAYO</option><option>PIURA</option><option>TRUJILLO</option></select></div><div class="row" style="margin-top:8px"><button onclick="cargar()">Resumen</button><button class="sec" onclick="materiales()">Materiales</button></div><div id="msg"></div></div>
<div class="card"><div id="metrics" class="metrics"></div><div id="conc"></div></div>
<div class="card"><h3>Utilidad por cuadrilla</h3><div class="tablewrap"><table id="tabla"></table></div></div>
<div id="matCard" class="card hidden"><h3>Materiales por cuadrilla</h3><div class="tablewrap"><table id="matTabla"></table></div></div>
<script>
const URL="https://uudvodiaizfarodjpetb.supabase.co",KEY="sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D",API=URL+"/functions/v1/analisis-economico-pilot";const sb=supabase.createClient(URL,KEY);
const E=id=>document.getElementById(id),H=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),M=n=>"S/ "+Number(n||0).toFixed(2);
async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||""}async function api(d){const t=await tok();if(!t)throw Error("Inicie sesión.");const u=new URL(API);Object.entries(d).forEach(([k,v])=>{if(v!==""&&v!=null)u.searchParams.set(k,String(v))});const r=await fetch(u,{headers:{Authorization:"Bearer "+t,apikey:KEY}}),x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"Error");return x}
function fresh(a){E("fresh").innerHTML=(a||[]).map(x=>'<span class="pill '+(x.requires_final_resync?'bad':'ok')+'">'+H(x.modulo)+' · '+H(x.status)+'</span>').join(" ")}
async function cargar(){try{E("msg").textContent="Consultando...";const [c,r,u]=await Promise.all([api({accion:"contextoEconomico"}),api({accion:"resumenEconomico",periodo:E("periodo").value}),api({accion:"utilidadEconomica",periodo:E("periodo").value,sede:E("sede").value})]);E("ctx").innerHTML='<span class="badge">'+H(c.usuario.usuario)+'</span><span class="badge">'+H(c.usuario.perfil)+'</span><span class="badge">Solo lectura</span>';fresh(r.freshness);const x=r.resumen||{};E("metrics").innerHTML='<div class="metric">Producción<b>'+M(x.produccion)+'</b></div><div class="metric">Materiales<b>'+M(x.materiales)+'</b></div><div class="metric">Bonos<b>'+M(x.bonos)+'</b></div><div class="metric">PDG<b>'+M(x.pago_pdg)+'</b></div><div class="metric">Penalidades<b>'+M(x.penalidades_win)+'</b></div><div class="metric">Costos parciales<b>'+M(x.costos_parciales)+'</b></div><div class="metric">Utilidad parcial<b>'+M(x.utilidad_parcial)+'</b></div><div class="metric">Completas<b>'+Number(x.cuadrillas_completas||0)+'</b></div><div class="metric">Incompletas<b>'+Number(x.cuadrillas_incompletas||0)+'</b></div>';const c2=r.conciliacion||{};E("conc").innerHTML='<details><summary>Conciliación legacy vs migración</summary><pre>'+H(JSON.stringify(c2,null,2))+'</pre></details>';E("tabla").innerHTML='<tr><th>Sede</th><th>Cuadrilla</th><th>Producción</th><th>Materiales</th><th>Sueldos</th><th>Combustible</th><th>Alquiler</th><th>Bonos</th><th>PDG</th><th>Penalidad</th><th>Costos parc.</th><th>Utilidad parc.</th><th>Utilidad confirmada</th><th>Estado</th></tr>'+(u.lista||[]).map(x=>'<tr><td>'+H(x.sede)+'</td><td>'+H(x.cuadrilla)+'</td><td>'+M(x.produccion)+'</td><td>'+M(x.materiales)+'</td><td>'+M(x.sueldos)+'</td><td>'+M(x.combustible)+'</td><td>'+M(x.alquiler_unidad)+'</td><td>'+M(x.bonos)+'</td><td>'+M(x.pago_pdg)+'</td><td>'+M(x.penalidades_win)+'</td><td>'+M(x.costos_parciales)+'</td><td>'+M(x.utilidad_parcial)+'</td><td>'+(x.utilidad_confirmada==null?'-':M(x.utilidad_confirmada))+'</td><td><span class="pill '+(x.estado_economico==="COMPLETO"?'ok':'bad')+'">'+H(x.estado_economico)+'</span></td></tr>').join("");E("msg").className="ok";E("msg").textContent=(u.lista||[]).length+" cuadrillas."}catch(e){E("msg").className="err";E("msg").textContent=e.message}}
async function materiales(){try{const d=await api({accion:"materialesEconomicos",periodo:E("periodo").value,sede:E("sede").value});E("matCard").classList.remove("hidden");E("matTabla").innerHTML='<tr><th>Sede</th><th>Cuadrilla</th><th>Materiales</th><th>Filas fuente</th></tr>'+(d.lista||[]).map(x=>'<tr><td>'+H(x.sede)+'</td><td>'+H(x.cuadrilla)+'</td><td>'+M(x.materiales)+'</td><td>'+Number(x.filas_materiales||0)+'</td></tr>').join("")}catch(e){E("msg").className="err";E("msg").textContent=e.message}}
cargar();
</script><script src="shell-embed.js"></script></body></html>
