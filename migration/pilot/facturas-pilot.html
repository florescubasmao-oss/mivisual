<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI VISUAL · Facturas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f5f7fb;color:#102033}.wrap{max-width:1280px;margin:auto}h1{margin:0 0 5px}.lead{color:#64748b;margin:0 0 14px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;padding:9px;border-radius:9px;border:1px solid #cbd5e1}input,select,textarea{width:100%}textarea{min-height:72px}button{border:0;background:#0f6fff;color:#fff;font-weight:700;cursor:pointer}button.sec{background:#475569}button.good{background:#15803d}button.warn{background:#b45309}button.danger{background:#b91c1c}button:disabled{opacity:.5}.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}.notice{padding:10px;background:#fff7ed;color:#9a3412;border-radius:10px;font-size:13px}.ok{color:#15803d}.err{color:#b91c1c}.muted{color:#64748b}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.metric{background:#f8fafc;border:1px solid #dbe3ec;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}.tablewrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;white-space:nowrap}tr.pick{cursor:pointer}tr.pick:hover{background:#eef6ff}.hidden{display:none!important}pre{white-space:pre-wrap;background:#f8fafc;border-radius:9px;padding:10px;overflow:auto}.pill{padding:3px 7px;border-radius:999px;background:#e2e8f0;font-size:11px}.pill.ok{background:#dcfce7}.pill.bad{background:#fee2e2;color:#991b1b}
@media(max-width:650px){body{padding:7px}.card{padding:10px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<h1>Facturas de Combustible</h1><p class="lead">Pendientes, comprobantes, observaciones y aprobación</p>
<div class="card"><div id="ctx" class="muted">Cargando...</div><div class="notice" style="margin-top:8px"><b>Piloto:</b> las imágenes se guardan en Supabase Storage privado. Mientras Apps Script siga activo, no presentar el mismo pendiente por ambos sistemas.</div></div>
<div class="card"><div class="grid"><input id="periodo" value="2026-09"><div class="row"><button onclick="cargar()">Actualizar</button><button id="crearBtn" class="good hidden" onclick="mostrarCrear()">Crear pendiente</button></div></div><div id="msg"></div></div>
<div class="card"><div id="metrics" class="metrics"></div><div id="lista"></div></div>
<div id="crearCard" class="card hidden"><h3>Crear pendiente</h3><div class="grid"><select id="responsable"></select><input id="desde" type="date"><input id="hasta" type="date"><input id="montoCfg" disabled></div><textarea id="obsCrear" placeholder="Observación opcional"></textarea><div class="row"><button onclick="crear()">Crear</button><button class="sec" onclick="E('crearCard').classList.add('hidden')">Cancelar</button></div><div id="cmsg"></div></div>
<div id="detCard" class="card hidden"><h3 id="detTitle">Detalle</h3><div id="detMeta"></div><div id="detalles"></div><div id="carga"></div><div id="dmsg"></div></div>
<script>
const URL="https://uudvodiaizfarodjpetb.supabase.co",KEY="sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D",API=URL+"/functions/v1/facturas-pilot";const sb=supabase.createClient(URL,KEY);let CTX=null,DET=null;
const E=id=>document.getElementById(id),H=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||""}
async function api(d,m="GET"){const t=await tok();if(!t)throw Error("Inicie sesión.");let r;if(m==="GET"){const u=new URL(API);Object.entries(d).forEach(([k,v])=>{if(v!==""&&v!=null)u.searchParams.set(k,String(v))});r=await fetch(u,{headers:{Authorization:"Bearer "+t,apikey:KEY}})}else r=await fetch(API,{method:"POST",headers:{Authorization:"Bearer "+t,apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(d)});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"Error");return x}
const money=n=>"S/ "+Number(n||0).toFixed(2);
async function cargar(){try{E("msg").textContent="Consultando...";CTX=await api({accion:"obtenerContextoFacturas",periodoMes:E("periodo").value});const u=CTX.usuario||{};E("ctx").innerHTML='<span class="badge">'+H(u.usuario)+'</span><span class="badge">'+H(u.perfil)+'</span><span class="badge">'+H(u.sede||"")+'</span><span class="badge">Fuente PostgreSQL piloto</span>';if(CTX.puedeCrear)E("crearBtn").classList.remove("hidden");else E("crearBtn").classList.add("hidden");const r=CTX.resumen||{};E("metrics").innerHTML='<div class="metric">Pendientes<b>'+Number(r.pendientes||0)+'</b></div><div class="metric">Presentados<b>'+Number(r.presentados||0)+'</b></div><div class="metric">Observados<b>'+Number(r.observados||0)+'</b></div><div class="metric">Aprobados<b>'+Number(r.aprobados||0)+'</b></div><div class="metric">Vencidos<b>'+Number(r.vencidos||0)+'</b></div>';E("lista").innerHTML=(CTX.lista||[]).map(x=>'<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+H(x.nombreResponsable)+'</b><br><small>'+H(x.sede)+' · '+H(x.cuadrilla||x.perfilResponsable)+'</small></div><span class="pill">'+H(x.estadoVisible)+'</span></div><p>'+H(x.fechaDesde)+' → '+H(x.fechaHasta)+' · '+money(x.montoRequerido)+' · '+Number(x.cantidad||0)+' factura(s)</p><button class="sec" onclick="abrir(\''+x.id+'\')">Abrir</button></div>').join("")||'<span class="muted">No hay pendientes en este periodo.</span>';E("msg").className="ok";E("msg").textContent="Actualizado."}catch(e){E("msg").className="err";E("msg").textContent=e.message}}
function mostrarCrear(){E("crearCard").classList.remove("hidden");E("responsable").innerHTML=(CTX.responsables||[]).map(x=>'<option value="'+H(x.usuario)+'">'+H(x.nombre)+' · '+H(x.perfil)+' · '+H(x.sede)+'</option>').join("");E("montoCfg").value=money(CTX.configuracion?.monto||100)}
async function crear(){try{const d=await api({accion:"crearPendienteFactura",usuarioResponsable:E("responsable").value,fechaDesde:E("desde").value,fechaHasta:E("hasta").value,observacion:E("obsCrear").value},"POST");E("cmsg").className="ok";E("cmsg").textContent=d.mensaje+" · "+d.periodo;E("crearCard").classList.add("hidden");await cargar()}catch(e){E("cmsg").className="err";E("cmsg").textContent=e.message}}
async function abrir(id){try{DET=await api({accion:"obtenerDetalleFactura",id});const p=DET.pendiente;E("detCard").classList.remove("hidden");E("detTitle").textContent=p.nombreResponsable||p.usuarioResponsable;E("detMeta").innerHTML='<p>'+H(p.fechaDesde)+' → '+H(p.fechaHasta)+' · <b>'+money(p.montoRequerido)+'</b> · '+H(p.estadoVisible)+'</p>';E("detalles").innerHTML=(DET.detalles||[]).map(d=>'<div class="card"><b>'+H(d.numero)+'</b> · '+money(d.monto)+' · '+H(d.estado)+(d.observacion?'<br><span class="err">'+H(d.observacion)+'</span>':'')+(d.url?'<br><a target="_blank" href="'+H(d.url)+'">Ver imagen</a>':'')+(DET.puedeValidar&&d.estado==="PRESENTADO"?'<br><button class="danger" onclick="observar(\''+d.id+'\')">Observar</button>':'')+'</div>').join("")||'<span class="muted">Sin comprobantes.</span>';renderCarga();if(DET.puedeValidar&&p.estado==="PRESENTADO")E("detalles").insertAdjacentHTML("beforeend",'<button class="good" onclick="aprobar()">Aprobar presentación</button>')}catch(e){E("dmsg").className="err";E("dmsg").textContent=e.message}}
function renderCarga(){const p=DET.pendiente;if(!DET.puedeCargar){E("carga").innerHTML="";return}const obs=(DET.detalles||[]).filter(x=>x.estado==="OBSERVADO");if(p.estado==="OBSERVADO"&&obs.length){E("carga").innerHTML='<h3>Reemplazar observadas</h3>'+obs.map((x,i)=>fila(i,x.id,x.numero,x.monto)).join("")+'<button onclick="presentar()">Enviar reemplazos</button>';return}E("carga").innerHTML='<h3>Subir comprobantes</h3><div id="filas">'+fila(0,"","","")+'</div><button class="sec" onclick="agregar()">Agregar factura</button> <button onclick="presentar()">Presentar</button>'}
function fila(i,reemplaza,numero,monto){return '<div class="card fact" data-reemplaza="'+H(reemplaza)+'"><div class="grid"><input class="num" placeholder="Número factura" value=""><input class="monto" type="number" min="0.01" step="0.01" placeholder="Monto"><input class="file" type="file" accept="image/*"></div>'+(reemplaza?'<small>Reemplaza '+H(numero)+' · '+money(monto)+'</small>':'')+'</div>'}
function agregar(){const c=document.querySelectorAll(".fact").length,max=Number(DET.configuracion?.maxFacturas||10);if(c>=max)return alert("Máximo "+max+" facturas.");E("filas").insertAdjacentHTML("beforeend",fila(c,"","",""))}
async function comprimir(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(Error("No se pudo leer imagen"));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(Error("Imagen inválida"));img.onload=()=>{const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res({nombre:file.name,mime:"image/jpeg",base64:cv.toDataURL("image/jpeg",.72)})};img.src=fr.result};fr.readAsDataURL(file)})}
async function presentar(){try{const fs=[...document.querySelectorAll(".fact")];const facturas=[];for(const f of fs){const numero=f.querySelector(".num").value.trim().toUpperCase(),monto=Number(f.querySelector(".monto").value),file=f.querySelector(".file").files?.[0];if(!numero||!monto||!file)throw Error("Cada factura necesita número, monto e imagen.");const img=await comprimir(file);facturas.push({numero,monto,reemplazaId:f.dataset.reemplaza||"",...img})}const d=await api({accion:"presentarFacturas",id:DET.pendiente.id,facturas},"POST");E("dmsg").className="ok";E("dmsg").textContent=d.mensaje;await abrir(DET.pendiente.id);await cargar()}catch(e){E("dmsg").className="err";E("dmsg").textContent=e.message}}
async function observar(id){const m=prompt("Motivo de observación:");if(!m)return;try{await api({accion:"observarDetalleFactura",idDetalle:id,observacion:m},"POST");await abrir(DET.pendiente.id);await cargar()}catch(e){E("dmsg").className="err";E("dmsg").textContent=e.message}}
async function aprobar(){if(!confirm("¿Aprobar toda la presentación?"))return;try{const d=await api({accion:"aprobarPresentacionFacturas",id:DET.pendiente.id},"POST");E("dmsg").className="ok";E("dmsg").textContent=d.mensaje;await abrir(DET.pendiente.id);await cargar()}catch(e){E("dmsg").className="err";E("dmsg").textContent=e.message}}
cargar();
</script><script src="shell-embed.js"></script></body></html>
