<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>MI VISUAL · Migración Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
:root{--navy:#0b2340;--navy2:#12304f;--blue:#0f6fff;--bg:#eef3f8;--card:#fff;--line:#dbe4ee;--text:#102033;--muted:#64748b;--green:#15803d;--red:#b91c1c;--orange:#b45309}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#07192e,#123b68)}
.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 28px 70px #0005}.brand{font-size:27px;font-weight:800;color:var(--navy);margin:0}.sub{color:var(--muted);line-height:1.45}
.field{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;margin:7px 0}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#475569}.btn.danger{background:#b91c1c}.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:22px;margin-top:10px;font-size:14px}.err{color:var(--red)}.ok{color:var(--green)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side-brand{padding:8px 10px 18px;border-bottom:1px solid #ffffff22}.side-brand b{display:block;font-size:20px}.side-brand small{color:#c7d4e3}.userbox{padding:14px 10px;border-bottom:1px solid #ffffff22;font-size:13px;line-height:1.5}.userbox strong{display:block;font-size:14px}.nav{padding-top:12px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#dce7f3;padding:10px 11px;border-radius:9px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav button:disabled{opacity:.48;cursor:not-allowed}.nav .group{color:#8fa8c2;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.08em;padding:13px 10px 5px}
.main{min-width:0}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:4}.topbar h1{font-size:17px;margin:0}.top-actions{display:flex;gap:8px}
.home{padding:22px}.hero{background:linear-gradient(135deg,#fff,#f7fbff);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.hero h2{margin:0 0 7px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#e8eef5;padding:5px 9px;border-radius:999px;font-size:12px}.badge.green{background:#dcfce7;color:#166534}.badge.orange{background:#ffedd5;color:#9a3412}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;min-height:140px;display:flex;flex-direction:column}.card h3{font-size:15px;margin:0 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.4;margin:0 0 15px}.card .btn{margin-top:auto;width:max-content}.status{font-size:11px;font-weight:700;margin-bottom:8px}.status.ready{color:var(--green)}.status.pending{color:var(--orange)}
.module-view{height:calc(100vh - 64px);background:#f5f7fb}.module-view iframe{width:100%;height:100%;border:0;background:#fff}.module-head{display:none}
.mobile-menu{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:260px;z-index:20;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{padding:0 12px}.home{padding:12px}.module-view{height:calc(100vh - 64px)}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <p class="brand">MI VISUAL</p>
    <p class="sub">Piloto integrado Supabase/PostgreSQL. Un solo acceso para todos los módulos migrados.</p>
    <input id="email" class="field" type="email" autocomplete="username" placeholder="Correo">
    <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button id="loginBtn" class="btn">Ingresar</button>
    <div style="margin-top:11px"><a href="/recuperar.html">¿Olvidaste tu contraseña?</a></div>
    <div id="loginMsg" class="msg"></div>
    <p class="sub" style="font-size:12px;margin-bottom:0">Este piloto no reemplaza aún la aplicación productiva.</p>
  </div>
</div>

<div id="shellView" class="shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-brand"><b>MI VISUAL</b><small>Migración Supabase</small></div>
    <div class="userbox"><strong id="uNombre"></strong><span id="uMeta"></span></div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <section class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button id="menuBtn" class="btn secondary mobile-menu">☰</button>
        <h1 id="pageTitle">Inicio</h1>
      </div>
      <div class="top-actions">
        <button id="homeBtn" class="btn secondary">Inicio</button>
        <button id="logoutBtn" class="btn danger">Salir</button>
      </div>
    </div>
    <div id="home" class="home"></div>
    <div id="moduleView" class="module-view hidden"><iframe id="moduleFrame" title="Módulo MI VISUAL"></iframe></div>
  </section>
</div>

<script>
const PROJECT_URL="https://uudvodiaizfarodjpetb.supabase.co";
const KEY="sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D";
const SHELL_API=PROJECT_URL+"/functions/v1/app-shell-pilot";
const sb=supabase.createClient(PROJECT_URL,KEY);
let CTX=null;

const ROUTES={
  "MAPA OPERATIVO":{title:"Mapa Operativo",page:"mapa-pilot.html",group:"Operación",desc:"Órdenes WIN y CTO cercanas."},
  "EQUIPOS AVERIADOS":{title:"Equipos Averiados",page:"equipos-averiados-pilot.html",group:"Operación",desc:"Solicitudes, recepción y cargos."},
  "SEGURIDAD":{title:"Seguridad ATS/PETAR",page:"seguridad-pilot.html",group:"Operación",desc:"ATS, PETAR, firmas y validaciones."},
  "ACCESOS":{title:"Accesos",page:"accesos-pilot.html",group:"Recursos",desc:"Enlaces operativos y certificaciones."},
  "BIBLIOTECA":{title:"Biblioteca",page:"biblioteca-pilot.html",group:"Recursos",desc:"Documentos y procedimientos."},
  "CAPACITACION":{title:"Capacitación",page:"capacitacion-pilot.html",group:"Recursos",desc:"Recursos y Mis Funciones."},
  "PUBLICADOR WIN":{title:"Publicador WIN",page:"publicador-win-pilot.html",group:"Jefatura",desc:"Previsualización y publicación piloto V497."},
  "BONOS SUPERVISORES":{title:"Bonos Supervisores",page:"bonos-supervisores-pilot.html",group:"Gestión",desc:"Evaluación y cálculo del bono de supervisores."},
  "MESA AYUDA":{title:"Mesa de Ayuda",page:"mesa-ayuda-pilot.html",group:"Soporte",desc:"Consultas, reclamos e historial."},
  "VALIDACION TECNICA":{title:"Validación Técnica",page:"validacion-tecnica-pilot.html",group:"Gestión",desc:"Recableado, GAR/VTR y validación por perfil."},
  "ACTAS ESCANEADAS":{title:"Gestión de Actas",page:"actas-pilot.html",group:"Gestión",desc:"Seguimiento, validaciones, entrega física y PDF histórico."},
  "PROGRAMACION DESCANSOS":{title:"Programación de Descansos",page:"descansos-pilot.html",group:"Gestión",desc:"Programación, cobertura y solicitudes de cambio."},
  "RANKING":{title:"Ranking",page:"ranking-pilot.html",group:"Indicadores",desc:"Ranking por período con pesos históricos protegidos."},
  "DASHBOARD JEFATURA":{title:"Dashboard Jefatura",page:"dashboard-pilot.html",group:"Indicadores",desc:"KPIs consolidados de Zona Norte."},
  "DASHBOARD SUPERVISOR":{title:"Dashboard Supervisor",page:"dashboard-pilot.html",group:"Indicadores",desc:"KPIs consolidados de la sede autorizada."},
  "OBSERVACIONES":{title:"Observaciones",page:"observaciones-pilot.html",group:"Gestión",desc:"Observaciones, penalidades, estados y descargos."},
  "ACTIVIDAD CAMPO":{title:"Actividad en Campo",page:"actividad-campo-pilot.html",group:"Operación",desc:"Auditorías, seguimiento, capacitación y control de campo."},
  "CHECKLIST ALMACEN":{title:"Checklist Almacén",page:"checklist-almacen-pilot.html",group:"Operación",desc:"Materiales, herramientas, unidad, documentación y EPP."},
  "PEXT":{title:"PEXT / Conjunta",page:"pext-pilot.html",group:"Operación",desc:"Normalización, Conjunta PEXT, Ordenamiento y bonos."},
  "PLANTILLA ORDEN":{title:"Plantilla de Orden",page:"plantilla-orden-pilot.html",group:"Operación",desc:"Consulta unificada de orden y CTO cercanas."},
  "FACTURAS":{title:"Facturas",page:"facturas-pilot.html",group:"Gestión",desc:"Facturas de combustible, pendientes y validación."},
  "ANALISIS ECONOMICO":{title:"Análisis Económico",page:"analisis-economico-pilot.html",group:"Gestión",desc:"Producción valorizada, costos y utilidad por cuadrilla."},
  "ADMINISTRACION":{title:"Administración",page:"administracion-pilot.html",group:"Sistema",desc:"Usuarios y migración de accesos Supabase Auth."}
};
const BACKEND_READY=new Set(["PRODUCCION","EFECTIVIDAD","PORCENTAJE RECABLEADO","VTR GAR","RANKING","VALIDACION TECNICA","ACTAS ESCANEADAS","PROGRAMACION DESCANSOS","OBSERVACIONES","ACTIVIDAD CAMPO","CHECKLIST ALMACEN"]);
const LABELS={"PORCENTAJE RECABLEADO":"Recableado","VTR GAR":"VTR / GAR","ACTAS ESCANEADAS":"Gestión de Actas","VALIDACION TECNICA":"Validación Técnica","PROGRAMACION DESCANSOS":"Programación de Descansos","ACTIVIDAD CAMPO":"Actividad en Campo","CHECKLIST ALMACEN":"Checklist Almacén","ANALISIS ECONOMICO":"Análisis Económico","UTILIDAD CUADRILLA":"Utilidad Cuadrilla","PLANTILLA ORDEN":"Plantilla Orden"};

function el(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(v){return String(v??"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
async function token(){const {data}=await sb.auth.getSession();return data.session?.access_token||""}
async function context(){
  const t=await token();if(!t)throw Error("Sesión requerida.");
  const r=await fetch(SHELL_API,{headers:{Authorization:"Bearer "+t,apikey:KEY},cache:"no-store"});
  const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"No se pudo cargar MI VISUAL.");return d;
}
function allowedPerms(){
  return (CTX?.permisos||[]).filter(p=>p.activo&&p.ver&&p.mostrarModulo&&norm(p.alcanceDatos)!=="SIN ACCESO");
}
function entries(){
  const out=[];
  const seen=new Set();
  for(const p of allowedPerms()){
    const key=norm(p.modulo);if(seen.has(key))continue;seen.add(key);
    const route=ROUTES[key];
    out.push({
      key,title:route?.title||LABELS[key]||key,group:route?.group||"Módulos",
      desc:route?.desc||"Backend migrado; integración visual en proceso.",
      page:route?.page||null,ready:!!route?.page,
      backendReady:BACKEND_READY.has(key)||!!route?.page
    });
  }
  return out;
}
function renderNav(){
  const list=entries().filter(x=>x.ready);
  const groups=[...new Set(list.map(x=>x.group))];
  el("nav").innerHTML='<button data-home class="active">⌂ Inicio</button>'+groups.map(g=>
    '<div class="group">'+esc(g)+'</div>'+
    list.filter(x=>x.group===g).map(x=>'<button data-key="'+esc(x.key)+'">'+esc(x.title)+'</button>').join("")
  ).join("");
  el("nav").querySelector("[data-home]").onclick=showHome;
  el("nav").querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>openModule(b.dataset.key));
}
function renderHome(){
  const all=entries();
  const ready=all.filter(x=>x.ready);
  const pending=all.filter(x=>!x.ready);
  el("home").innerHTML=
    '<div class="hero"><h2>MI VISUAL integrado</h2><p class="sub">Sesión única activa. Los módulos disponibles usan Supabase Auth + Edge Functions + PostgreSQL.</p>'+
    '<div class="badges"><span class="badge green">'+ready.length+' módulos integrados</span><span class="badge orange">'+pending.length+' módulos visibles pendientes de UI</span><span class="badge">'+esc(CTX.usuario.perfil)+'</span><span class="badge">'+esc(CTX.usuario.sede||"Zona Norte")+'</span></div></div>'+
    '<div class="cards">'+all.map(x=>
      '<div class="card"><div class="status '+(x.ready?'ready':'pending')+'">'+(x.ready?'INTEGRADO':'BACKEND / UI PENDIENTE')+'</div>'+
      '<h3>'+esc(x.title)+'</h3><p>'+esc(x.desc)+'</p>'+
      (x.ready?'<button class="btn" data-open="'+esc(x.key)+'">Abrir</button>':'<button class="btn secondary" disabled>En integración</button>')+
      '</div>').join("")+'</div>';
  el("home").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openModule(b.dataset.open));
}
function setActive(key){
  el("nav").querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  const b=key?el("nav").querySelector('[data-key="'+CSS.escape(key)+'"]'):el("nav").querySelector("[data-home]");
  if(b)b.classList.add("active");
}
function showHome(){
  el("moduleView").classList.add("hidden");el("home").classList.remove("hidden");el("pageTitle").textContent="Inicio";setActive(null);
  el("moduleFrame").src="about:blank";el("sidebar").classList.remove("open");history.replaceState(null,"",location.pathname);
}
function openModule(key){
  const item=entries().find(x=>x.key===key);if(!item?.page)return;
  el("home").classList.add("hidden");el("moduleView").classList.remove("hidden");el("pageTitle").textContent=item.title;setActive(key);
  el("moduleFrame").src=item.page+"?embed=1&shell=1";el("sidebar").classList.remove("open");
  history.replaceState(null,"","#"+encodeURIComponent(key));
}
async function enter(){
  CTX=await context();
  el("uNombre").textContent=CTX.usuario.nombre||CTX.usuario.usuario;
  el("uMeta").innerHTML=esc(CTX.usuario.perfil)+"<br>"+esc(CTX.usuario.sede||"")+(CTX.usuario.cuadrilla?"<br>"+esc(CTX.usuario.cuadrilla):"");
  el("loginView").classList.add("hidden");el("shellView").classList.remove("hidden");
  renderNav();renderHome();
  const key=decodeURIComponent(location.hash.slice(1)||"");
  if(entries().some(x=>x.key===key&&x.ready))openModule(key);else showHome();
}
async function login(){
  const email=el("email").value.trim(),password=el("password").value;
  if(!email||!password){el("loginMsg").className="msg err";el("loginMsg").textContent="Ingrese correo y contraseña.";return}
  el("loginBtn").disabled=true;el("loginMsg").textContent="Validando...";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){el("loginMsg").className="msg err";el("loginMsg").textContent=error.message;el("loginBtn").disabled=false;return}
  try{await enter();el("password").value=""}catch(e){await sb.auth.signOut();el("loginMsg").className="msg err";el("loginMsg").textContent=e.message}
  el("loginBtn").disabled=false;
}
function resetLoggedOut(){
  el("moduleFrame").src="about:blank";CTX=null;history.replaceState(null,"",location.pathname);
  el("shellView").classList.add("hidden");el("loginView").classList.remove("hidden");el("loginMsg").textContent="Sesión cerrada.";
}
async function logout(){
  CTX=null;
  const {error}=await sb.auth.signOut();
  resetLoggedOut();
  if(error){el("loginMsg").className="msg err";el("loginMsg").textContent="No se pudo cerrar sesión: "+error.message}
}
el("loginBtn").onclick=login;el("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
el("logoutBtn").onclick=logout;el("homeBtn").onclick=showHome;el("menuBtn").onclick=()=>el("sidebar").classList.toggle("open");
window.addEventListener("message",e=>{if(e.data?.type==="mv-module-error")console.warn("Módulo:",e.data.message)});
sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")resetLoggedOut()});
sb.auth.getSession().then(async({data})=>{if(data.session){try{await enter()}catch(e){el("loginMsg").className="msg err";el("loginMsg").textContent=e.message}}});
</script>
</body>
</html>
