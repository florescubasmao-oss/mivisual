<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI VISUAL · Biblioteca piloto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#edf2f7;color:#12304f;margin:0;padding:24px}main{max-width:1060px;margin:auto}header{background:#12304f;color:white;padding:24px;border-radius:16px}section{margin:22px 0}input,button{padding:12px;border:1px solid #bac9d8;border-radius:8px;font:inherit;margin:4px 0}button{background:#1669c1;color:white;cursor:pointer}input{max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}a.resource{display:flex;flex-direction:column;gap:12px;background:white;color:#12304f;padding:20px;border:1px solid #d7e0ea;border-radius:12px;text-decoration:none}a.resource:hover{border-color:#1669c1}small{color:#48637e}#status{min-height:24px}label{display:inline-block}#search{width:100%}[hidden]{display:none!important}</style></head><body><main>
<header><h1>Biblioteca</h1><p>MI VISUAL · Piloto de consulta</p></header>
<section><form id="loginForm"><label>Correo<br><input id="email" type="email" autocomplete="username" required></label> <label>Contraseña<br><input id="password" type="password" autocomplete="current-password" required></label> <button>Ingresar</button></form><button id="refresh" type="button">Actualizar enlaces</button> <button id="logout" type="button">Cerrar sesión</button><p id="status" role="status" aria-live="polite"></p></section>
<div id="resources" hidden><label for="search">Buscar enlace</label><input id="search" type="search" placeholder="Manuales, procedimientos y documentos"><section><h2>Documentos de consulta</h2><div id="catalog" class="grid"></div></section></div>
</main><script>
const SUPABASE_URL='https://uudvodiaizfarodjpetb.supabase.co',KEY='sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D';
const client=supabase.createClient(SUPABASE_URL,KEY);const el=id=>document.getElementById(id);let generation=0;
function clear(){generation++;el('resources').hidden=true;el('catalog').replaceChildren();}
function card(row){const a=document.createElement('a');const url=new URL(row.link);if(!['https:','http:'].includes(url.protocol))throw Error('Enlace no válido');a.href=url.href;a.className='resource';a.target='_blank';a.rel='noopener noreferrer';const title=document.createElement('b');title.textContent=row.nombre;const note=document.createElement('small');note.textContent=row.categoria||'Abrir en otra pestaña';a.append(title,note);return a}
function filter(){const q=el('search').value.trim().toLocaleLowerCase('es');document.querySelectorAll('.resource').forEach(a=>a.hidden=!a.textContent.toLocaleLowerCase('es').includes(q))}
async function load(){clear();const ticket=generation;el('status').textContent='Consultando enlaces…';try{const {data,error}=await client.auth.getSession();if(error||!data.session)throw Error('Ingresa con tu cuenta del piloto.');const response=await fetch(SUPABASE_URL+'/functions/v1/biblioteca-pilot',{headers:{Authorization:'Bearer '+data.session.access_token,apikey:KEY},cache:'no-store'});const payload=await response.json();if(!response.ok||!payload.ok)throw Error(payload.error||'No se pudo consultar Biblioteca.');if(ticket!==generation)return;payload.recursos.forEach(r=>el('catalog').appendChild(card(r)));el('resources').hidden=false;el('status').textContent=payload.perfil+' · '+payload.recursos.length+' documentos disponibles.';filter()}catch(e){if(ticket===generation){clear();el('status').textContent=e.message}}}
el('loginForm').addEventListener('submit',async event=>{event.preventDefault();clear();const button=event.submitter;button.disabled=true;try{const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error)throw error;await load()}catch(e){el('status').textContent=e.message}finally{button.disabled=false}});
el('refresh').onclick=load;el('search').oninput=filter;el('logout').onclick=async()=>{clear();const {error}=await client.auth.signOut();el('status').textContent=error?'No se pudo cerrar sesión: '+error.message:'Sesión cerrada.'};
client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){clear();el('status').textContent='Sesión cerrada.'}});load();
</script></body></html>
