<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI VISUAL · Programación de Descansos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>
:root{--navy:#0b2340;--blue:#0f6fff;--green:#15803d;--red:#b91c1c;--orange:#b45309;--line:#dbe3ec;--muted:#64748b}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f5f7fb;color:#102033}.wrap{max-width:1280px;margin:auto}
h1{margin:0 0 5px;font-size:24px}.lead{color:var(--muted);margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}input,select,textarea{width:100%}textarea{min-height:74px}
button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button.sec{background:#475569}button.good{background:var(--green)}button.danger{background:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:999px;margin:2px;font-size:12px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--orange)}.muted{color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px;background:#f8fafc}.metric b{display:block;font-size:20px}
.tablewrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}tr.pick{cursor:pointer}tr.pick:hover{background:#eef6ff}tr.selected{background:#dbeafe}
.notice{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412}.hidden{display:none!important}pre{white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:9px;max-height:260px;overflow:auto}
@media(max-width:650px){body{padding:8px}.card{padding:12px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<h1>Programación de Descansos</h1><p class="lead">PostgreSQL · Cobertura, programación y aprobaciones</p>
<div class="card"><div id="ctx" class="muted">Cargando...</div></div>
<div class="card"><div class="grid"><input id="periodo" value="2026-09" placeholder="YYYY-MM"><select id="sede"><option value="TODAS">Todas las sedes</option><option>CHICLAYO</option><option>PIURA</option><option>TRUJILLO</option></select><input id="fechaCob" type="date"></div><div class="row" style="margin-top:8px"><button onclick="listar()">Actualizar</button><button class="sec" onclick="cobertura()">Ver cobertura</button><button class="sec" onclick="notificaciones()">Pendientes</button></div><div id="msg"></div></div>
<div class="card"><div class="metrics" id="coverage"></div><div class="tablewrap"><table id="tabla"></table></div></div>
<div id="programarCard" class="card hidden"><h3>Programar / cambiar estado</h3><div class="grid"><select id="entidad"></select><input id="fechaProg" type="date"><select id="estadoProg"><option>EN CAMPO</option><option>EN CAMPO BOLSA</option><option>DESCANSO</option><option>VACACIONES</option></select></div><textarea id="motivoProg" placeholder="Motivo obligatorio"></textarea><button onclick="guardar()">Guardar programación</button><div id="pmsg"></div></div>
<div id="tecnicoCard" class="card hidden"><h3>Solicitar cambio de descanso</h3><div class="grid"><input id="fechaActual" type="date"><input id="nuevaFecha" type="date"></div><textarea id="motivoCambio" placeholder="Motivo"></textarea><button onclick="solicitarCambio()">Enviar solicitud</button><div id="tmsg"></div></div>
<div class="card"><h3>Pendientes de validación</h3><div id="pendientes" class="muted">Pulse “Pendientes”.</div></div>
<div class="card"><details><summary>Historial</summary><div class="tablewrap"><table id="hist"></table></div></details></div>
<script>
const URL="https://uudvodiaizfarodjpetb.supabase.co",KEY="sb_publishable_2hiwePKtqoo3_c_D5B9JuA_p38dPe3D",API=URL+"/functions/v1/descansos-pilot";const sb=supabase.createClient(URL,KEY);let CTX=null,DATA=null,PEND=[];
const E=id=>document.getElementById(id),N=v=>String(v??"").trim().toUpperCase(),H=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||""}
async function api(d,m="GET"){const t=await tok();if(!t)throw Error("Inicie sesión en MI VISUAL.");let r;if(m==="GET"){const u=new window.URL(API);Object.entries(d).forEach(([k,v])=>{if(v!==""&&v!=null)u.searchParams.set(k,Array.isArray(v)?JSON.stringify(v):String(v))});r=await fetch(u,{headers:{Authorization:"Bearer "+t,apikey:KEY}})}else r=await fetch(API,{method:"POST",headers:{Authorization:"Bearer "+t,apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(d)});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"Error");return x}
function sm(id,t,ok=true){E(id).className=ok?"ok":"err";E(id).textContent=t}
async function contexto(){CTX=await api({accion:"contextoDescansos"});E("ctx").innerHTML='<span class="badge">'+H(CTX.usuario.usuario)+'</span><span class="badge">'+H(CTX.usuario.perfil)+'</span><span class="badge">'+H(CTX.usuario.sede||"")+'</span><span class="badge">Alcance: '+H(CTX.permiso.alcance_datos)+'</span>';const p=N(CTX.usuario.perfil);if(["SUPERVISOR","JEFATURA","JEFATURA GENERAL"].includes(p))E("programarCard").classList.remove("hidden");if(p==="TECNICO")E("tecnicoCard").classList.remove("hidden")}
async function listar(){try{sm("msg","Consultando...");DATA=await api({accion:"listarDescansos",periodo:E("periodo").value,sede:E("sede").value});const ents=DATA.cuadrillas||[],prog=DATA.programacion||[],hist=DATA.historial||[];E("entidad").innerHTML=ents.map(x=>'<option value="'+H(x.cuadrilla)+'">'+H((x.nombrePersonal||x.cuadrilla)+" · "+x.sede+" · "+x.plataforma)+'</option>').join("");E("tabla").innerHTML='<tr><th>Fecha</th><th>Sede</th><th>Cuadrilla / Personal</th><th>Plataforma</th><th>Estado</th><th>Programación</th><th>Solicitud</th></tr>'+prog.map(x=>'<tr><td>'+H(x.fecha)+'</td><td>'+H(x.sede)+'</td><td>'+H(x.cuadrilla)+'</td><td>'+H(x.plataforma)+'</td><td>'+H(x.estadoDia||x.estado_dia||x.estadoVigente||"")+'</td><td>'+H(x.estadoProgramacion||x.estado_programacion||"")+'</td><td>'+H(x.solicitudCambio||"")+'</td></tr>').join("");E("hist").innerHTML='<tr><th>Fecha</th><th>Cuadrilla</th><th>Estado</th><th>Validación</th><th>Solicitó</th></tr>'+hist.map(x=>'<tr><td>'+H(x.fecha)+'</td><td>'+H(x.cuadrilla)+'</td><td>'+H(x.estadoDia||"")+'</td><td>'+H(x.estadoProgramacion||x.estadoValidacion||"")+'</td><td>'+H(x.solicitadoPor||"")+'</td></tr>').join("");sm("msg",prog.length+" registros vigentes · "+ents.length+" entidades.")}catch(e){sm("msg",e.message,false)}}
async function cobertura(){try{if(!E("fechaCob").value)throw Error("Seleccione fecha.");const d=await api({accion:"resumenCoberturaDescansos",fecha:E("fechaCob").value});const a=d.resumen||[];E("coverage").innerHTML=a.map(x=>'<div class="metric">'+H(x.sede)+' · '+H(x.plataforma)+'<b>'+H(Math.round(Number(x.porcentaje||0)*100))+'%</b><small>'+H(x.estado)+' · '+H(x.enCampo)+'/'+H(x.total)+'</small></div>').join("")}catch(e){sm("msg",e.message,false)}}
async function guardar(){try{const reg=[{cuadrilla:E("entidad").value,fecha:E("fechaProg").value,estadoDia:E("estadoProg").value}];const d=await api({accion:"guardarProgramacionDescansos",registros:reg,motivo:E("motivoProg").value},"POST");sm("pmsg",d.guardados+" cambio(s) guardado(s). Estado: "+d.estado);await listar()}catch(e){sm("pmsg",e.message,false)}}
async function solicitarCambio(){try{const d=await api({accion:"solicitarCambioDescanso",fechaActual:E("fechaActual").value,nuevaFecha:E("nuevaFecha").value,motivo:E("motivoCambio").value},"POST");sm("tmsg","Solicitud enviada: "+d.estado);await listar()}catch(e){sm("tmsg",e.message,false)}}
async function notificaciones(){try{const d=await api({accion:"notificacionesDescansos"});PEND=d.solicitudes||[];E("pendientes").innerHTML=PEND.length?PEND.map((x,i)=>'<div class="card" style="margin:8px 0"><b>'+H(x.cuadrilla)+'</b> · '+H(x.fecha)+' · '+H(x.estado)+'<br><small>'+H(x.solicitudCambio||"")+'</small><div class="row" style="margin-top:7px">'+accionesPend(x,i)+'</div></div>').join(""):'No hay pendientes.'}catch(e){E("pendientes").innerHTML='<span class="err">'+H(e.message)+'</span>'}}
function accionesPend(x,i){const p=N(CTX.usuario.perfil);if(p==="SUPERVISOR")return '<button class="good" onclick="resolverSup('+i+',\'APROBADO\')">Aprobar</button><button class="danger" onclick="resolverSup('+i+',\'RECHAZADO\')">Rechazar</button>';if(["JEFATURA","JEFATURA GENERAL"].includes(p))return '<button class="good" onclick="resolverJef('+i+',\'APROBADO\')">Aprobar</button><button class="sec" onclick="resolverJef('+i+',\'OBSERVADO\')">Observar</button><button class="danger" onclick="resolverJef('+i+',\'RECHAZADO\')">Rechazar</button>';return ""}
async function resolverSup(i,res){try{const motivo=prompt("Comentario:")||"";await api({accion:"validarSupervisorDescanso",id:PEND[i].id,resultado:res,motivo},"POST");await notificaciones();await listar()}catch(e){alert(e.message)}}
async function resolverJef(i,res){try{const motivo=prompt("Comentario de Jefatura (obligatorio):")||"";await api({accion:"resolverJefaturaDescansos",ids:[PEND[i].id],resultado:res,motivo},"POST");await notificaciones();await listar()}catch(e){alert(e.message)}}
(async()=>{try{const now=new Date();E("fechaCob").value=now.toISOString().slice(0,10);await contexto();await listar();await notificaciones()}catch(e){E("ctx").innerHTML='<span class="err">'+H(e.message)+'</span>'}})();
</script><script src="shell-embed.js"></script></body></html>
